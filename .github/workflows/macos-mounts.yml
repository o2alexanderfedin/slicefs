name: macOS mounts

# Real FUSE-T mounts on a fresh macOS VM: the Boost round trip through SliceFS
# on FSKit (the only backend). The job first enables the FUSE-T FSKit module
# without the System Settings GUI (enable-fskit.sh).
# Long (about 2.5 hours), so not on every pull request.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Boost versions, space separated (for example 1_83_0 1_84_0 1_85_0)"
        default: "1_85_0"
      skip_tree:
        description: "Copy only the tar files, not the trees (a tree copy takes 30-40 min per version)"
        type: boolean
        default: false
  push:
    branches: [develop, main, "ci/**"]

jobs:
  mounts:
    name: macOS ${{ matrix.backend }} (Boost round trip)
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        backend: [fskit]
    steps:
      - uses: actions/checkout@v4

      - name: Install pkg-config and FUSE-T
        run: |
          brew install pkg-config
          brew install --cask macos-fuse-t/cask/fuse-t
          sw_vers

      - name: Enable the FUSE-T FSKit extension
        run: scripts/macos-mount-test/enable-fskit.sh

      - name: Cache the Boost download
        uses: actions/cache@v4
        with:
          path: ~/boost
          key: boost-${{ inputs.versions || '1_85_0' }}-v1

      - name: Fetch Boost ${{ inputs.versions || '1_85_0' }}
        run: scripts/macos-mount-test/fetch-boost.sh ~/boost ${{ inputs.versions || '1_85_0' }}

      - name: Build slicefs (release)
        run: cargo build --release -p slicefs-cli

      - name: Boost round trip (${{ matrix.backend }})
        env:
          SLICEFS: target/release/slicefs
          BOOST_DIR: ~/boost
          WORK: ${{ runner.temp }}/work
          # The tree copy to the mount takes up to about 1 hour.
          STEP_TIMEOUT: 5400
          SKIP_TREE: ${{ inputs.skip_tree && '1' || '' }}
        run: |
          export BOOST_DIR=$HOME/boost
          scripts/macos-mount-test/boost-test.sh ${{ matrix.backend }} ${{ inputs.versions || '1_85_0' }}

      - name: FSKit diagnostics
        if: failure()
        run: |
          S="$HOME/Library/Group Containers/group.com.apple.fskit.settings"
          ls -la "$S" || true
          plutil -p "$S/enabledModules.plist" || true
          pluginkit -m -v -p com.apple.fskit.fsmodule || true
          /usr/bin/log show --last 30m --style compact --predicate \
            'subsystem BEGINSWITH "com.apple.FSKit" OR process CONTAINS[c] "fskit" OR process == "go-nfsv4"' \
            | tail -200 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-mounts-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/work/*/mount.log
            ${{ runner.temp }}/work/*/mount.err
            ${{ runner.temp }}/work/*/perf.csv
            ${{ runner.temp }}/work/*/top.log
          if-no-files-found: ignore
