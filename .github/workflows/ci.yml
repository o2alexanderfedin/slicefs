# Windows CI (PLAT-03): Deferred to v2.
# Reason: winfsp-rs is GPL-3, incompatible with most commercial licensing.
# Alternatives to evaluate in v2: dokan-rs (MIT), Windows ProjFS (native).
# See: .planning/phases/07-cross-platform-and-production-hardening/07-CONTEXT.md

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  linux:
    name: Linux (tests, FUSE smoke, live checks, pjdfstest — in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # crates/data-id is a private repository that GITHUB_TOKEN cannot read.
      # DATA_ID_DEPLOY_KEY is a read-only deploy key of that repository.
      - name: Fetch the data-id submodule
        env:
          DATA_ID_DEPLOY_KEY: ${{ secrets.DATA_ID_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DATA_ID_DEPLOY_KEY" > ~/.ssh/data_id && chmod 600 ~/.ssh/data_id
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/data_id -o IdentitiesOnly=yes" \
            git -c url."git@github.com:".insteadOf="https://github.com/" \
            submodule update --init --recursive
          rm -f ~/.ssh/data_id

      # The harness runs in a container with /dev/fuse, so a hung mount dies
      # with the container (see scripts/docker-linux-test/run.sh).
      - name: Unit tests and Linux FUSE smoke test
        run: scripts/docker-linux-test/run.sh all

      - name: Live checks (read-only mount, crash + remount, snapshots)
        run: scripts/docker-linux-test/run.sh verify

      - name: pjdfstest (must report PASS)
        run: scripts/docker-linux-test/run.sh pjdfstest

  macos:
    name: macOS (cargo test, FUSE-T build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # crates/data-id is a private repository that GITHUB_TOKEN cannot read.
      # DATA_ID_DEPLOY_KEY is a read-only deploy key of that repository.
      - name: Fetch the data-id submodule
        env:
          DATA_ID_DEPLOY_KEY: ${{ secrets.DATA_ID_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DATA_ID_DEPLOY_KEY" > ~/.ssh/data_id && chmod 600 ~/.ssh/data_id
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/data_id -o IdentitiesOnly=yes" \
            git -c url."git@github.com:".insteadOf="https://github.com/" \
            submodule update --init --recursive
          rm -f ~/.ssh/data_id

      - name: Install pkg-config and FUSE-T
        run: |
          brew install pkg-config
          brew install --cask macos-fuse-t/cask/fuse-t

      # The build finds FUSE-T through .pkgconfig/fuse.pc (.cargo/config.toml).
      - name: cargo test --workspace
        run: cargo test --workspace
