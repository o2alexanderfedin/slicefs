# Windows CI (PLAT-03): Deferred to v2.
# Reason: winfsp-rs is GPL-3, incompatible with most commercial licensing.
# Alternatives to evaluate in v2: dokan-rs (MIT), Windows ProjFS (native).
# See: .planning/phases/07-cross-platform-and-production-hardening/07-CONTEXT.md

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:   # release.yml runs these tests before it creates a tag

jobs:
  linux:
    name: Linux (tests, FUSE smoke, live checks, pjdfstest — in Docker)
    runs-on: ubuntu-latest
    # The longest of the last 10 successful runs was 9.9 min; 1.5 times that,
    # rounded up to 5 min, with 30 min as the least limit (Phase 21.2, D-07).
    timeout-minutes: 30
    # POOL-04: the Linux mounts run with 4 request workers; each step fails
    # without the Workers line of that value.
    env:
      SLICEFS_WORKERS: "4"
      # Build output and the cargo registry live in host folders, not in
      # Docker volumes, so actions/cache keeps them between runs. No
      # incremental data: it is most of a debug target and a cache gains
      # little from it.
      SLICEFS_TARGET_VOL: /home/runner/ci-cache/target
      SLICEFS_CARGO_VOL: /home/runner/ci-cache/registry
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: /home/runner/ci-cache
          key: linux-docker-${{ hashFiles('Cargo.lock', 'scripts/docker-linux-test/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            linux-docker-${{ hashFiles('Cargo.lock', 'scripts/docker-linux-test/Dockerfile') }}-
            linux-docker-

      # The harness runs in a container with /dev/fuse, so a hung mount dies
      # with the container (see scripts/docker-linux-test/run.sh).
      - name: Unit tests and Linux FUSE smoke test
        run: |
          set -o pipefail
          scripts/docker-linux-test/run.sh all 2>&1 | tee "$RUNNER_TEMP/all.log"
          grep -q 'Workers: 4 (set)' "$RUNNER_TEMP/all.log" || { echo "no 'Workers: 4 (set)' line in the output"; exit 1; }

      - name: Live checks (read-only mount, crash + remount, snapshots)
        run: |
          set -o pipefail
          scripts/docker-linux-test/run.sh verify 2>&1 | tee "$RUNNER_TEMP/verify.log"
          grep -q 'Workers: 4 (set)' "$RUNNER_TEMP/verify.log" || { echo "no 'Workers: 4 (set)' line in the output"; exit 1; }

      - name: pjdfstest (must report PASS)
        run: |
          set -o pipefail
          scripts/docker-linux-test/run.sh pjdfstest 2>&1 | tee "$RUNNER_TEMP/pjdfstest.log"
          grep -q 'Workers: 4 (set)' "$RUNNER_TEMP/pjdfstest.log" || { echo "no 'Workers: 4 (set)' line in the output"; exit 1; }

      # The containers write the cache folders as root; the cache step saves
      # them as the runner user. Drop incremental data before the save.
      - name: Prepare the build cache for saving
        if: always()
        run: |
          sudo rm -rf /home/runner/ci-cache/target/*/incremental
          sudo chown -R "$(id -u):$(id -g)" /home/runner/ci-cache 2>/dev/null || true
          du -sh /home/runner/ci-cache/* 2>/dev/null || true

  macos:
    name: macOS (cargo test, FUSE-T build)
    runs-on: macos-latest
    # The longest of the last 10 successful runs was 5.5 min; 1.5 times that,
    # rounded up to 5 min, with 30 min as the least limit (Phase 21.2, D-07).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore the build cache
        uses: Swatinem/rust-cache@v2

      - name: Install pkg-config and FUSE-T
        run: |
          brew install pkg-config
          brew install --cask macos-fuse-t/cask/fuse-t

      # The build finds FUSE-T through .pkgconfig/fuse.pc (.cargo/config.toml).
      - name: cargo test --workspace
        run: cargo test --workspace
