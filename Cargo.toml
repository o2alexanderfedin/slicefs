[workspace]
members = [
    "crates/slicefs-traits",
    "crates/cas-local",
    "crates/metadata",
    "crates/slicefs-cli",
    "crates/slicefs-compression",
    "crates/slicefs-dedup",
]
resolver = "2"

[workspace.dependencies]
thiserror  = "2"
sha2-compress = "0.7.1"
blake3     = "1"
fastbloom  = "0.14"
proptest   = "1"
tempfile   = "3"
serde      = { version = "1", features = ["derive"] }
bincode    = "2"
tracing    = "0.1"
criterion  = { version = "0.5", features = ["html_reports"] }
clap       = { version = "4", features = ["derive"] }

# Not used in Phase 1 but wired up for later phases:
fuser      = { version = "0.17" }
redb       = "4.1"
fastcdc    = "3.2"
tokio      = { version = "1", features = ["full"] }
libc       = "0.2"
anyhow     = "1"
zstd       = "0.13"
lz4_flex   = "0.11"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32c      = "0.6"
metrics     = "0.23"
parking_lot = "0.12"
crossbeam-channel = "0.5"
