[workspace]
members = [
    "crates/dedupfs-traits",
    "crates/cas-local",
    "crates/metadata",
]
resolver = "2"

[workspace.dependencies]
thiserror  = "2"
sha2-compress = "0.7.1"
blake3     = "1"
fastbloom  = "0.14"
proptest   = "1"
tempfile   = "3"
serde      = { version = "1", features = ["derive"] }
bincode    = "2"
tracing    = "0.1"
criterion  = { version = "0.5", features = ["html_reports"] }

# Not used in Phase 1 but wired up for later phases:
fuser      = "0.17"
redb       = "3.1"
fastcdc    = "3.2"
tokio      = { version = "1", features = ["full"] }
libc       = "0.2"
anyhow     = "1"
