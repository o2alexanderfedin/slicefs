[package]
name = "chunk-store"
version = "0.1.0"
edition = "2021"
description = "Content-addressed chunk store: FastCDC + BLAKE3 objects in append-only pack files"

[dependencies]
blake3.workspace = true
fastcdc.workspace = true
zstd.workspace = true
crc32c = "0.6"
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true
parking_lot.workspace = true
# Lock timing recorder, only with the `lock-stats` feature (see `lock_stats`).
hdrhistogram = { version = "7.6", default-features = false, optional = true }

[features]
# A second, test-only hasher (`hash::TestKeyedBlake3`) in the registry, for
# tests of hash changes in the crates that use the store.
test-hasher = []
# Hold and wait times of the store lock and other locks, as hdrhistogram
# histograms (`lock_stats::snapshot`). Off by default: no timing, no dependency.
lock-stats = ["dep:hdrhistogram"]
# Lets `parking_lot::deadlock::check_deadlock` find lock cycles (stress builds).
deadlock-detect = ["parking_lot/deadlock_detection"]

[dev-dependencies]
tempfile.workspace = true
