[package]
name = "chunk-store"
version = "0.1.0"
edition = "2021"
description = "Content-addressed chunk store: FastCDC + BLAKE3 objects in append-only pack files"

[dependencies]
blake3.workspace = true
fastcdc.workspace = true
zstd.workspace = true
crc32c = "0.6"
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true

[features]
# A second, test-only hasher (`hash::TestKeyedBlake3`) in the registry, for
# tests of hash changes in the crates that use the store.
test-hasher = []

[dev-dependencies]
tempfile.workspace = true
