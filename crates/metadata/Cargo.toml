[package]
name = "metadata"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Fedin <af@o2.services>", "Sergey Shandar"]
license = "AGPL-3.0-or-later"

[features]
# Lock hold and wait times (stress harness report); forwards to the recorder.
lock-stats = ["chunk-store/lock-stats"]
# Lock cycle detection for stress builds; forwards to the shim crate.
deadlock-detect = ["chunk-store/deadlock-detect"]

[dependencies]
slicefs-traits = { path = "../slicefs-traits" }
chunk-store = { path = "../chunk-store" }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
crc32c = "0.6"
parking_lot = { workspace = true }

[dev-dependencies]
# Registers a second hasher (`chunk_store::hash::TestKeyedBlake3`) for tests
# of a change of the write hash.
chunk-store = { path = "../chunk-store", features = ["test-hasher"] }
proptest = { workspace = true }
tempfile = { workspace = true }
