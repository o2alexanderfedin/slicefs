[package]
name = "slicefs-cli"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Fedin <af@o2.services>", "Sergey Shandar"]
license = "AGPL-3.0-or-later"
description = "SliceFS FUSE binary — mounts, seeds, and manages SliceFS volumes"

[[bin]]
name = "slicefs"
path = "src/main.rs"

[features]
# Lock hold and wait times in the stress harness report.
lock-stats = ["chunk-store/lock-stats", "metadata/lock-stats"]
# Lock cycle detection and the harness watchdog (stress builds).
deadlock-detect = ["chunk-store/deadlock-detect", "metadata/deadlock-detect"]

[dependencies]
slicefs-traits       = { path = "../slicefs-traits" }
metadata             = { path = "../metadata" }
chunk-store          = { path = "../chunk-store" }

clap           = { workspace = true }
fuser          = { workspace = true }
libc           = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sha2-compress  = { workspace = true }
parking_lot    = { workspace = true }

[dev-dependencies]
# Registers a second hasher (`chunk_store::hash::TestKeyedBlake3`) for tests
# of a change of the write hash.
chunk-store = { path = "../chunk-store", features = ["test-hasher"] }
tempfile = { workspace = true }
# Content hashes of the store tree in the read-only mount tracer.
blake3 = { workspace = true }
# Latency histograms of the stress harness (`tests/stress_harness.rs`).
hdrhistogram = { version = "7.6", default-features = false }
