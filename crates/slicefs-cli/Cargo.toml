[package]
name = "slicefs-cli"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Fedin <af@o2.services>", "Sergey Shandar"]
license = "AGPL-3.0-or-later"
description = "SliceFS FUSE binary — mounts, seeds, and manages SliceFS volumes"

[[bin]]
name = "slicefs"
path = "src/main.rs"

[dependencies]
slicefs-traits       = { path = "../slicefs-traits" }
slicefs-dedup        = { path = "../slicefs-dedup" }
metadata             = { path = "../metadata" }
blockset             = { path = "../data-id/blockset" }

clap           = { workspace = true }
fuser          = { workspace = true }
libc           = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
sha2-compress  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
